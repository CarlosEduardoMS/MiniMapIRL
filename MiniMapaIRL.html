<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Mapa</title>
<style>
html,body{margin:0;width:100%;height:100%}
#map{width:100%;height:100%}
#localizacao{position:absolute;bottom:20px;right:20px;width:50px;height:50px;border:0;border-radius:50%;background:white;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:24px;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="map"></div>
<button id="localizacao" onclick="irParaMinhaLocalizacao()">📍</button>
<script>
let map, marcadorLocalizacao, circuloPrecisao, ultimaPosicao, primeiraLocalizacao=true;

function initMap(){
    map=new google.maps.Map(document.getElementById("map"),{
        center:{lat:-19.9167,lng:-43.9345},
        zoom:15,
        mapId:"b6df2c47d429e772296c1187"
    });
    iniciarLocalizacao();
}

function iniciarLocalizacao(){
    if(!navigator.geolocation){
        alert("Seu dispositivo não suporta localização.");
        return;
    }

    navigator.geolocation.watchPosition(
        function(position){
            const pos={lat:position.coords.latitude,lng:position.coords.longitude};
            const precisao=position.coords.accuracy;
            ultimaPosicao=pos;

            if(!marcadorLocalizacao){
                marcadorLocalizacao=new google.maps.marker.AdvancedMarkerElement({
                    map:map,position:pos,title:"Minha localização"
                });
            }else{
                marcadorLocalizacao.position=pos;
            }

            if(!circuloPrecisao){
                circuloPrecisao=new google.maps.Circle({
                    map:map,center:pos,radius:precisao,
                    fillColor:"#4285F4",fillOpacity:.15,
                    strokeColor:"#4285F4",strokeOpacity:.4,strokeWeight:1
                });
            }else{
                circuloPrecisao.setCenter(pos);
                circuloPrecisao.setRadius(precisao);
            }

            if(primeiraLocalizacao){
                map.setCenter(pos);
                map.setZoom(17);
                primeiraLocalizacao=false;
            }
        },
        function(erro){
            if(erro.code===erro.PERMISSION_DENIED) alert("Permissão de localização foi negada.");
            else if(erro.code===erro.POSITION_UNAVAILABLE) alert("Não foi possível obter sua localização.");
            else if(erro.code===erro.TIMEOUT) alert("Tempo esgotado ao tentar obter sua localização.");
            else alert("Erro desconhecido ao obter localização.");
        },
        {enableHighAccuracy:true,maximumAge:1000,timeout:10000}
    );
}

function irParaMinhaLocalizacao(){
    if(!ultimaPosicao){
        alert("Aguardando sua localização...");
        return;
    }
    map.setCenter(ultimaPosicao);
    map.setZoom(17);
}
</script>

<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBy8yfbGaDl79mlrZTGoCDdpby4R3u1uMQ&libraries=marker&callback=initMap"></script>
</body>
</html>
